{% extends "base.html" %}
{% block title %}Log In — LaunchPad{% endblock %}
{% block content %}
    <div class="card form-card">
        <h2 style="font-size: 1.35rem; margin-bottom: 0.25rem;">Welcome back</h2>
        <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem;">Log in to manage listings or track applications.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
        </form>
    </div>
{% endblock %}
